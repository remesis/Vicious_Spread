<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Vicious Spread — Shotgun Comparison</title>
    <style>
      :root {
        --bg: #101315;
        --panel: #181c1f;
        --plot: #121719;
        --line: #303739;
        --text: #eceee9;
        --muted: #9ba6a5;
        --accent: #39ff14;
        --gap: 10px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      summary {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      select,
      input[type="range"],
      input[type="checkbox"] {
        cursor: pointer;
      }
      button {
        color: inherit;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      button:disabled,
      input:disabled {
        cursor: default;
        opacity: 0.4;
      }
      a {
        color: var(--muted);
        text-underline-offset: 4px;
      }
      .viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      .shell {
        position: absolute;
        width: 1280px;
        padding: 16px;
        transform-origin: top left;
        visibility: hidden;
        --preview-height: 200px;
        --plot-height: 200px;
      }
      .shell[data-fitted] {
        visibility: visible;
      }
      header {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 0;
        grid-area: brand;
      }
      .brand {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .brand-mark {
        width: 37px;
        height: 37px;
        border: 1px solid var(--accent);
        border-radius: 50%;
        position: relative;
        color: var(--accent);
        flex: none;
      }
      .brand-mark:before,
      .brand-mark:after {
        content: "";
        position: absolute;
        background: currentColor;
        border-radius: 50%;
        width: 4px;
        height: 4px;
        top: 16px;
        left: 16px;
        box-shadow:
          9px -7px 0 -1px currentColor,
          -9px -6px 0 -1px currentColor,
          8px 8px 0 -1px currentColor,
          -7px 9px 0 -1px currentColor;
      }
      .brand-mark:after {
        width: 1px;
        height: 47px;
        top: -6px;
        left: 17px;
        opacity: 0.4;
        box-shadow: none;
        transform: rotate(45deg);
        border-radius: 0;
      }
      h1 {
        font-size: 26px;
        line-height: 1.1;
        letter-spacing: -1.2px;
        font-weight: 650;
        margin: 0;
        white-space: nowrap;
      }
      .layout {
        display: grid;
        grid-template-columns: 218px minmax(0, 1fr);
        grid-template-areas: "brand toolbar" "rail weapons";
        gap: var(--gap);
        align-items: stretch;
      }
      .layout:not([data-view="side"]) {
        grid-template-areas: "brand toolbar" "rail plot" "rail weapons";
        grid-template-rows: auto var(--plot-height) auto;
      }
      .rail {
        grid-area: rail;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .rail-summary {
        display: none;
      }
      .rail-content {
        display: flex;
        flex-direction: column;
      }
      .rail-section {
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }
      .rail-section:last-child {
        border-bottom: 0;
      }
      .eyebrow {
        font:
          10px/1.4 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        text-transform: uppercase;
        letter-spacing: 1.8px;
        color: var(--muted);
        margin: 0 0 10px;
      }
      .control {
        margin-top: 12px;
      }
      .control:first-of-type {
        margin-top: 0;
      }
      .control-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 5px;
      }
      .control-line label {
        font-size: 12px;
      }
      .unit-number {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--accent);
        font:
          12px ui-monospace,
          monospace;
      }
      .unit-number input {
        width: 55px;
        padding: 3px;
        text-align: right;
        color: inherit;
        background: #121617;
        border: 1px solid #3b4440;
        border-radius: 4px;
        -moz-appearance: textfield;
      }
      input::-webkit-inner-spin-button,
      input::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="range"] {
        display: block;
        width: 100%;
        height: 15px;
        margin: 0;
        accent-color: var(--accent);
      }
      .end-labels {
        display: flex;
        justify-content: space-between;
        color: #74817f;
        font:
          10px ui-monospace,
          monospace;
        margin-top: 4px;
      }
      .switch-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 15px 0;
        cursor: pointer;
      }
      .switch-row:last-child {
        margin-bottom: 0;
      }
      .switch-row input {
        appearance: none;
        -webkit-appearance: none;
        width: 30px;
        height: 17px;
        border: 1px solid #56605e;
        border-radius: 15px;
        background: #2b3233;
        position: relative;
        margin: 0;
        flex: none;
      }
      .switch-row input:before {
        content: "";
        width: 11px;
        height: 11px;
        position: absolute;
        top: 2px;
        left: 2px;
        background: #9ba6a5;
        border-radius: 50%;
      }
      .switch-row input:checked {
        border-color: var(--accent);
        background: var(--accent);
      }
      .switch-row input:checked:before {
        left: 15px;
        background: #14220e;
      }
      .switch-copy {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        font-size: 11px;
      }
      .switch-copy small {
        color: var(--muted);
        font:
          10px ui-monospace,
          monospace;
        white-space: nowrap;
      }
      .rank-buttons {
        display: grid;
        grid-template-columns: 1.3fr repeat(6, 1fr);
        gap: 3px;
      }
      .rank-buttons button {
        background: #121617;
        border: 1px solid #38403f;
        border-radius: 4px;
        padding: 7px 0;
        font:
          11px ui-monospace,
          monospace;
      }
      .rank-buttons button[aria-pressed="true"] {
        background: var(--accent);
        color: #14220e;
        border-color: var(--accent);
      }
      .buttons {
        display: flex;
        gap: 7px;
        margin-top: 16px;
      }
      .button {
        border: 1px solid #424c48;
        background: #252d29;
        border-radius: 5px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 550;
      }
      .button.primary {
        color: #14220e;
        background: var(--accent);
        border-color: var(--accent);
      }
      .button.quiet {
        background: transparent;
      }
      #play {
        flex: 1;
      }
      .workspace {
        display: contents;
      }
      .segmented {
        display: flex;
        padding: 3px;
        background: #1b2022;
        border: 1px solid var(--line);
        border-radius: 7px;
        gap: 2px;
        flex: none;
      }
      .segmented button {
        background: none;
        border: 0;
        color: var(--muted);
        padding: 7px 12px;
        border-radius: 4px;
        font-size: 12px;
        white-space: nowrap;
      }
      .segmented button[aria-pressed="true"] {
        color: var(--accent);
        background: #353d3b;
      }
      .plot-toolbar {
        grid-area: toolbar;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 12px;
        min-height: 46px;
        min-width: 0;
        background: var(--plot);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 9px 12px;
      }
      .plot-meta {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 7px 14px;
        margin-left: auto;
      }
      .toolbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        max-width: 100%;
      }
      #viewMode {
        flex: 0 1 auto;
        flex-wrap: wrap;
        min-width: 0;
      }
      .plot-toolbar .segmented button {
        font-size: 11px;
        padding: 6px 8px;
      }
      .rank-switch {
        display: flex;
        align-items: center;
        border-radius: 4px;
        flex: none;
        max-width: 100%;
      }
      .rank-switch:has(> button[aria-pressed="true"]) {
        background: #353d3b;
      }
      .baseline-label {
        color: var(--muted);
        font:
          10px ui-monospace,
          monospace;
      }
      .plot-scale {
        color: var(--muted);
        font:
          10px ui-monospace,
          monospace;
        text-align: right;
      }
      .canvas-wrap {
        grid-area: plot;
        position: relative;
        height: 380px;
        min-width: 0;
        background: var(--plot);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: pan-y;
      }
      .empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        color: var(--muted);
        pointer-events: none;
      }
      .empty[hidden] {
        display: none;
      }
      #sweepWeapon {
        width: 126px;
        max-width: 140px;
        font-size: 11px;
        background: transparent;
        border: 0;
        border-left: 1px solid #59625e;
        border-radius: 0;
        margin-right: 4px;
      }
      .tiny-button {
        border: 0;
        background: none;
        color: var(--muted);
        font-size: 11px;
        padding: 3px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .weapons {
        grid-area: weapons;
        display: grid;
        grid-template-columns: repeat(var(--weapon-count, 5), minmax(0, 1fr));
        gap: var(--gap);
        min-width: 0;
      }
      .weapon {
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--weapon);
        border-radius: 8px;
        overflow: hidden;
        min-width: 0;
      }
      .weapon-header {
        padding: 12px 12px 0;
      }
      .weapon-plot {
        position: relative;
        background: var(--plot);
        width: 100%;
        height: var(--preview-height);
      }
      .weapon-plot canvas {
        position: absolute;
        inset: 0;
      }
      .weapon-body {
        display: flex;
        flex-direction: column;
        flex: 1;
        padding: 12px;
      }
      .workspace[data-view="side"] .canvas-wrap,
      .workspace:not([data-view="side"]) .weapon-plot {
        display: none;
      }
      .weapon.off .weapon-body,
      .weapon.off .weapon-sub,
      .weapon.off .weapon-plot {
        opacity: 0.38;
      }
      .weapon-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .weapon-title input {
        margin: 0;
        width: 13px;
        height: 13px;
        accent-color: var(--accent);
        flex: none;
      }
      .weapon-sub {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 10px;
        margin: 4px 0 6px 21px;
        min-height: 16px;
      }
      .weapon-sub > span {
        white-space: nowrap;
      }
      .weapon-sub strong {
        color: var(--text);
        font-weight: 500;
      }
      .statline {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 8px;
        text-align: center;
        margin-bottom: 12px;
      }
      .stat-number {
        color: var(--weapon);
        font-size: 23px;
        line-height: 1.1;
        letter-spacing: -1px;
        font-variant-numeric: tabular-nums;
      }
      .stat-name {
        font-size: 9px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 4px;
      }
      .weapon-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        color: var(--muted);
        margin-top: 9px;
      }
      .weapon-row input[type="number"] {
        width: 62px;
        background: #111617;
        border: 1px solid #3d4643;
        color: var(--text);
        border-radius: 4px;
        padding: 4px 6px;
        font:
          11px ui-monospace,
          monospace;
        text-align: right;
      }
      select {
        background: #111617;
        border: 1px solid #3d4643;
        color: var(--text);
        border-radius: 4px;
        padding: 4px 5px;
        max-width: 100%;
      }
      .weapon-rank {
        padding-top: 12px;
      }
      .weapon-rank-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 27px;
        font-size: 10px;
        color: var(--muted);
      }
      .barrel-control {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 9px;
      }
      .barrel-control select {
        font-size: 10px;
      }
      .weapon-rank .rank-buttons {
        width: 100%;
        margin-top: 8px;
      }
      .weapon-rank .rank-buttons button {
        padding: 7px 0;
        font-size: 10px;
      }
      .riven-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 5px;
        font-size: 10px;
        color: var(--muted);
      }
      .weapon-overcharge {
        margin: 0 0 10px;
        gap: 8px;
      }
      .weapon-overcharge .switch-copy {
        min-width: 0;
        gap: 5px;
        font-size: 10px;
      }
      .weapon-overcharge .switch-copy small {
        font-size: 9px;
      }
      .riven-heading > span {
        min-width: 0;
      }
      .riven-format {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 88px;
        margin: 0;
        padding: 2px;
      }
      .riven-format button {
        padding: 5px 2px;
        font:
          9px ui-monospace,
          monospace;
      }
      .riven-control {
        margin-top: 9px;
      }
      .riven-control .weapon-row {
        margin: 0 0 6px;
      }
      .riven-switch {
        flex: 1;
        min-width: 0;
        margin: 0;
        gap: 5px;
      }
      .riven-switch input {
        width: 26px;
        height: 15px;
      }
      .riven-switch input:before {
        width: 9px;
        height: 9px;
      }
      .riven-switch input:checked:before {
        left: 13px;
      }
      .riven-control .weapon-row input[type="number"] {
        width: 55px;
      }
      .riven-control .end-labels {
        font-size: 9px;
      }
      .mod-group + .mod-group {
        border-top: 1px solid var(--line);
        margin-top: 12px;
        padding-top: 10px;
      }
      .mod-heading {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        color: var(--muted);
        font:
          10px ui-monospace,
          monospace;
        margin: 0 0 7px;
      }
      .mod-group .switch-row {
        margin: 7px 0;
        gap: 8px;
      }
      .mote-readout {
        color: var(--accent);
        font:
          11px ui-monospace,
          monospace;
        margin-top: 8px;
      }
      .shot-sample .control {
        margin: 0;
      }
      .shot-sample .buttons {
        margin-top: 9px;
        gap: 5px;
      }
      .shot-sample .button {
        padding: 7px 8px;
        font-size: 11px;
        white-space: nowrap;
      }
      .shot-sample #play,
      .shot-sample #singleShot {
        flex: 1;
      }
      .shot-sample #reset {
        min-width: 30px;
      }
      .shot-sample #moveDrones {
        width: 100%;
        margin-top: 7px;
      }
      footer {
        margin-top: var(--gap);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #75827e;
        font:
          10px ui-monospace,
          monospace;
      }

      @media (max-width: 1100px), (hover: none) and (pointer: coarse) {
        html,
        body {
          height: auto;
          min-height: 100%;
          overflow: visible;
          -webkit-text-size-adjust: 100%;
          text-size-adjust: 100%;
        }
        .viewport {
          position: static;
          overflow: visible;
        }
        .shell {
          position: relative;
          width: 100%;
          max-width: 1100px;
          margin: 0 auto;
          padding: max(16px, env(safe-area-inset-top))
            max(12px, env(safe-area-inset-right))
            max(16px, env(safe-area-inset-bottom))
            max(12px, env(safe-area-inset-left));
        }
        .layout,
        .layout:not([data-view="side"]) {
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas: "brand" "rail" "toolbar" "weapons";
          grid-template-rows: none;
          gap: 12px;
        }
        .layout:not([data-view="side"]) {
          grid-template-areas: "brand" "rail" "toolbar" "plot" "weapons";
        }
        header {
          min-height: 48px;
        }
        h1 {
          font-size: 28px;
        }
        .rail-summary {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          min-height: 52px;
          padding: 12px 16px;
          color: var(--text);
          font-size: 16px;
          font-weight: 600;
          cursor: pointer;
          list-style: none;
        }
        .rail-summary::-webkit-details-marker {
          display: none;
        }
        .rail-summary::after {
          content: "";
          width: 8px;
          height: 8px;
          margin-right: 3px;
          border-right: 2px solid var(--accent);
          border-bottom: 2px solid var(--accent);
          transform: rotate(45deg);
        }
        .rail[open] .rail-summary {
          border-bottom: 1px solid var(--line);
        }
        .rail[open] .rail-summary::after {
          transform: rotate(225deg);
        }
        .rail-content {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          grid-template-areas: "range mods" "sample mods";
          align-items: start;
        }
        .rail-section {
          padding: 16px;
        }
        .rail-section:first-child {
          grid-area: range;
        }
        .rail-section:nth-child(2) {
          grid-area: mods;
          border-left: 1px solid var(--line);
          border-bottom: 0;
        }
        .shot-sample {
          grid-area: sample;
        }
        .eyebrow {
          font-size: 11px;
        }
        .control-line label,
        .switch-copy {
          font-size: 14px;
        }
        .unit-number,
        .mod-heading,
        .mote-readout {
          font-size: 12px;
        }
        .unit-number input,
        .weapon-row input[type="number"],
        .riven-control .weapon-row input[type="number"] {
          width: 76px;
          min-height: 44px;
          padding: 8px;
          font-size: 16px;
        }
        input[type="range"] {
          height: 44px;
        }
        .end-labels,
        .riven-control .end-labels {
          font-size: 11px;
          margin-top: 0;
        }
        .switch-row,
        .mod-group .switch-row,
        .weapon-overcharge {
          min-height: 44px;
          margin: 6px 0;
        }
        .switch-row input,
        .riven-switch input {
          width: 36px;
          height: 22px;
        }
        .switch-row input::before,
        .riven-switch input::before {
          width: 14px;
          height: 14px;
          top: 3px;
          left: 3px;
        }
        .switch-row input:checked::before,
        .riven-switch input:checked::before {
          left: 17px;
        }
        .switch-copy small,
        .weapon-overcharge .switch-copy small {
          font-size: 11px;
        }
        button,
        select,
        .shot-sample .button {
          min-height: 44px;
        }
        .button,
        .shot-sample .button {
          font-size: 14px;
        }
        .shot-sample #reset {
          min-width: 44px;
        }
        .plot-toolbar {
          display: flex;
          flex-direction: column;
          align-items: stretch;
          padding: 12px;
          gap: 12px;
        }
        #projection > button {
          flex: 1;
        }
        .plot-toolbar .segmented button {
          font-size: 12px;
          padding: 8px;
        }
        .plot-meta {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          margin-left: 0;
          gap: 4px 10px;
        }
        .toolbar-actions {
          grid-column: 1 / -1;
          flex-wrap: wrap;
          gap: 4px;
        }
        #restore {
          width: 100%;
          text-align: right;
          font-size: 12px;
        }
        #viewMode {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          width: 100%;
        }
        .rank-switch {
          display: contents;
        }
        #sweepWeapon {
          grid-column: 1 / -1;
          width: 100%;
          max-width: none;

    <script>
      (() => {
        "use strict";

        // Configuration and calculator state.
        const TAU = Math.PI * 2;
        const DRONE_RADIUS_M = 1;
        const RANK_COUNT = 7;
        const PLAYBACK_INTERVAL_MS = 50;
        const MAX_DPR = 2;
        const VIEWPORT_INSET = 6;
        const MAX_LAYOUT_WIDTH = 1995;
        const MIN_RANK_CELL_WIDTH = 260;
        const compactLayout = window.matchMedia(
          "(max-width: 1100px), (hover: none) and (pointer: coarse)",
        );
        const RIVEN_BASE_VALUES = { multishot: 119.7, fireRate: 89.9999982 };
        const RIVEN_FORMAT_FACTORS = { "2p1n": 1.2375, "3p1n": 0.9375 };
        const RIVEN_FIELDS = [
          {
            field: "riven",
            stat: "multishot",
            label: "Riven Multishot",
            flag: "rivenMS",
            resample: true,
          },
          {
            field: "rivenRate",
            stat: "fireRate",
            label: "Riven Fire Rate",
            flag: "rivenFR",
            resample: false,
          },
        ];
        const DEFINITIONS = [
          {
            id: "kuva",
            name: "Kuva Sobek",
            pellets: 5,

            disposition: 0.8,
            angle: 16,

          {

            name: "Sobek",
            pellets: 5,
            baseRate: 2.5,
            disposition: 1.33,
            angle: 16,
            defaultRank: 5,

            riven: 216.7,
            rivenRate: 162.9,
            color: "#77cbd1",
            supportsClipDelegation: true,
          },
          {
            id: "kohm",

            pellets: 12,
            baseRate: 11 / 3,
            disposition: 1.3,
            angle: 20,
            defaultRank: 5,
            rivenFormat: "2p1n",
            riven: 211.8,
            rivenRate: 159.3,

          },
          {

            defaultRank: 2,
            rivenFormat: "3p1n",
            riven: 165.4,
            rivenRate: 124.4,
            color: "#a8ca83",
          },
          {
            id: "strun",
            name: "Strun Wraith",
            pellets: 10,
            baseRate: 2.5,
            disposition: 1.35,
            angle: 20,
            defaultRank: 5,
            rivenFormat: "3p1n",
            riven: 166.6,
            rivenRate: 125.3,
            color: "#b6a1e3",
            barrel: 5,
            pelletsPerBarrelStack: 0.05,
          },
        ];
        const $ = (id) => document.getElementById(id);
        const shell = document.querySelector(".shell");
        const canvas = $("plot"),
          ctx = canvas.getContext("2d", { alpha: false });
        const background = document.createElement("canvas"),
          bg = background.getContext("2d", { alpha: false });
        const state = {
          distance: 25,
          mote: 762,
          targetSeed: 4919,
          galv: true,
          vigilante: false,
          clipDelegation: false,
          barrage: 90,
          tempo: false,
          frail: true,
          blast: false,
          fervor: false,
          magnetic: false,
          history: 10,
          view: "side",
          projection: "impact",
          sweep: "strun",
          playing: false,
          seed: 43271,
        };
        const weapons = DEFINITIONS.map((d, index) => ({
          ...d,
          index,
          enabled: true,
          overcharge: true,
          rivenMS: true,
          rivenFR: true,
          rank: d.defaultRank,
          shotCount: 10,
          accumulator: 0,
          shots: [],
          model: null,
        }));
        const SHARED_SWITCHES = [
          ["galvanized", "galv", true],
          ["vigilante", "vigilante", true],
          ["clipDelegation", "clipDelegation", true],
          ["tempo", "tempo", false],
          ["frail", "frail", false],
          ["blast", "blast", false],
          ["fervor", "fervor", false],
          ["magnetic", "magnetic", false],
        ];
        const ui = new Map();
        let width = 0,
          height = 0,
          dpr = 1,
          cells = [],
          sideSize = null,
          dirtyStatic = true,
          dirtyStats = true,
          frame = 0,
          timer = 0,
          lastTick = 0;
        const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
        const numeric = (v, a, b, fallback) =>
          Number.isFinite(Number(v)) && String(v).trim() !== ""
            ? clamp(Number(v), a, b)
            : fallback;
        const fmt = (v, n = 1) =>
          v.toLocaleString("en-US", {
            maximumFractionDigits: n,
            minimumFractionDigits: n,
          });
        const spreadBonus = (rank) => (rank < 0 ? 0 : (rank + 1) * 0.1);
        const rankName = (rank) => (rank < 0 ? "Off" : `R${rank}`);
        const radius = (angle, rank) =>
          state.distance *
          Math.tan((angle * (1 + spreadBonus(rank)) * Math.PI) / 180);

        // Desktop fits one viewport; compact layouts keep controls at their natural size.
        let fitFrame = 0,
          previousCompact = null;
        function fitWorkspace() {
          fitFrame = 0;
          const compact = compactLayout.matches;
          if (compact !== previousCompact) {
            $("controls").open = !compact;
            previousCompact = compact;
          }
          if (compact) {
            for (const property of ["width", "transform", "left", "top"])
              shell.style.removeProperty(property);
            const cardWidth = ui.get(weapons[0].id).article.clientWidth;
            const plotWidth = $("weapons").clientWidth - 2;
            const cols = rankColumns(plotWidth);
            const rows = Math.ceil(RANK_COUNT / cols);
            const plotHeight =
              state.view === "ranks"
                ? rows * Math.min(360, Math.ceil(plotWidth / cols + 66))
                : clamp(plotWidth * 0.9, 280, 520);
            shell.style.setProperty("--preview-height", cardWidth - 4 + "px");
            shell.style.setProperty(
              "--plot-height",
              Math.round(plotHeight) + "px",
            );
            shell.dataset.fitted = "";
            return;
          }
          const viewport = window.visualViewport;
          const availableWidth = viewport?.width || innerWidth,
            availableHeight = viewport?.height || innerHeight;
          const usableWidth = Math.max(1, availableWidth - VIEWPORT_INSET * 2),
            usableHeight = Math.max(1, availableHeight - VIEWPORT_INSET * 2);
          shell.style.width =
            clamp(
              availableWidth,
              280 + weapons.length * 250,
              MAX_LAYOUT_WIDTH,
            ) + "px";
          const previewHeight = ui.get(weapons[0].id).article.clientWidth - 4;
          const enlargedHeight =
            (clamp(availableHeight - 600, 240, 320) - 88) * 1.25 + 88;
          const plotWidth = $("weapons").clientWidth - 2;
          const plotHeight =
            state.view === "ranks"
              ? Math.min(enlargedHeight, Math.ceil(plotWidth / RANK_COUNT + 66))
              : enlargedHeight;
          shell.style.setProperty("--preview-height", previewHeight + "px");
          shell.style.setProperty(
            "--plot-height",
            Math.round(plotHeight) + "px",
          );
          const naturalWidth = shell.offsetWidth,
            naturalHeight = shell.offsetHeight;
          const scale = Math.min(
            1,
            usableWidth / naturalWidth,
            usableHeight / naturalHeight,
          );
          shell.style.transform = `scale(${scale})`;
          shell.style.left =
            (viewport?.offsetLeft || 0) +
            (availableWidth - naturalWidth * scale) / 2 +
            "px";
          shell.style.top = (viewport?.offsetTop || 0) + VIEWPORT_INSET + "px";
          shell.dataset.fitted = "";
        }
        function queueWorkspaceFit() {
          if (!fitFrame) fitFrame = requestAnimationFrame(fitWorkspace);
        }

        // Weapon calculations and Riven ranges.
        function updateModels() {
          const mods = 1 + (state.galv ? 2.3 : 0) + (state.vigilante ? 0.6 : 0);
          const hasteBonus = state.mote * 1.5;
          const fireMods =
            state.barrage +
            (state.tempo ? 90 : 0) +
            (state.frail ? 90 : 0) +
            (state.blast ? 60 : 0) +
            (state.fervor ? 45 : 0) +
            (state.magnetic ? 40 : 0);
          for (const w of weapons) {
            const base =
              w.pellets + (w.barrel ?? 0) * (w.pelletsPerBarrelStack ?? 0);
            const clipBonus =
              state.clipDelegation && w.supportsClipDelegation ? 2.25 : 0;
            const pellets =
                base *
                (mods +
                  (w.overcharge ? 3.5 : 0) +
                  clipBonus +
                  (w.rivenMS ? w.riven / 100 : 0)),
              spokes = Math.max(1, Math.ceil(pellets));
            if (w.model?.spokes !== spokes) dirtyStatic = true;
            const fireRate =
              w.baseRate *
              Math.max(
                0,
                1 +
                  (hasteBonus + fireMods + (w.rivenFR ? w.rivenRate : 0)) / 100,
              );
            w.model = {
              pellets,
              spokes,
              halfAngle: w.angle * (1 + spreadBonus(w.rank)),
              radius: radius(w.angle, w.rank),
              fireRate,
              pelletsPerSecond: pellets * fireRate,
            };
          }
          $("moteBonus").textContent = `+${fmt(hasteBonus, 0)}% fire rate`;
          $("fireModsBonus").textContent =
            `${fireMods >= 0 ? "+" : ""}${fmt(fireMods, 0)}%`;
        }
        function rivenRange(w, stat, format) {
          const mean =
            RIVEN_BASE_VALUES[stat] *
            w.disposition *
            RIVEN_FORMAT_FACTORS[format];
          const round = (v) => Math.floor(v * 10 + 0.5 + 1e-8) / 10;
          return { low: round(mean * 0.9), high: round(mean * 1.1) };
        }
        function syncRivenControls(w) {
          const refs = ui.get(w.id);
          for (const b of refs.rivenFormat.children)
            b.setAttribute(
              "aria-pressed",
              String(b.dataset.format === w.rivenFormat),
            );
          for (const { field, stat } of RIVEN_FIELDS) {
            const r = rivenRange(w, stat, w.rivenFormat);
            for (const el of [refs[field], refs[field + "Slider"]]) {
              el.min = r.low;
              el.max = r.high;
              el.value = w[field];
            }
            refs[field + "Low"].textContent = fmt(r.low) + "%";
            refs[field + "High"].textContent = fmt(r.high) + "%";
          }
        }
        function targetFor(w, rank = w.rank) {
          const rand = randomFor(state.targetSeed + w.index * 197),
            angle = rand() * TAU;
          const outer = radius(w.angle, rank),
            distance = Math.min(
              Math.max(0, outer - DRONE_RADIUS_M),
              outer * (0.78 + rand() * 0.14),
            );
          return {
            x: Math.cos(angle) * distance,
            y: Math.sin(angle) * distance,
            radius: DRONE_RADIUS_M,
          };
        }

        // Seeded samples keep weapon and rank comparisons reproducible.
        function randomFor(shot) {
          let s = (state.seed ^ Math.imul(shot + 1, 0x9e3779b9)) >>> 0;
          return () => {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        function makeShot(w, shot) {
          const rand = randomFor(shot),
            expected = w.model.pellets;
          const count =
            Math.floor(expected) +
            (rand() < expected - Math.floor(expected) ? 1 : 0);
          const points = new Float32Array(count * 2);
          const spokes = w.model.spokes;
          const indices = new Uint16Array(spokes);
          for (let i = 0; i < spokes; i++) indices[i] = i;
          for (let i = spokes - 1; i > 0; i--) {
            const j = Math.floor(rand() * (i + 1));
            const old = indices[i];
            indices[i] = indices[j];
            indices[j] = old;
          }
          for (let i = 0; i < count; i++) {
            const a = (indices[i] * TAU) / spokes,
              r = rand();
            points[i * 2] = Math.cos(a) * r;
            points[i * 2 + 1] = Math.sin(a) * r;
          }
          return points;
        }
        function regenerate() {
          for (const w of weapons) {
            w.shots.length = 0;
            for (
              let i = Math.max(0, w.shotCount - state.history);
              i < w.shotCount;
              i++
            )
              w.shots.push(makeShot(w, i));
          }
          dirtyStats = true;
        }
        function emitShot(w) {
          w.shots.push(makeShot(w, w.shotCount++));
          if (w.shots.length > state.history) w.shots.shift();
        }
        function fire() {
          for (const w of weapons) emitShot(w);
          dirtyStats = true;
          requestPaint();
        }
        function requestPaint(staticChanged = false) {
          dirtyStatic ||= staticChanged;
          if (!frame) frame = requestAnimationFrame(paint);
        }
        function schedule() {
          clearTimeout(timer);
          timer = 0;
          if (!state.playing || document.hidden) return;
          lastTick = performance.now();
          timer = setTimeout(playbackTick, PLAYBACK_INTERVAL_MS);
        }
        function playbackTick() {

          for (const baseline of c.baselinePaths) {
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#121719";
            ctx.stroke(baseline.path);
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = baseline.color;
            ctx.stroke(baseline.path);
          }
          ctx.setLineDash([]);
          ctx.lineWidth = 1;
        }
        function updateStats() {
          syncSwitches();
          for (const w of weapons) {
            const el = ui.get(w.id);
            el.pellets.textContent = fmt(w.model.pellets, 1);
            el.pps.textContent = fmt(w.model.pelletsPerSecond, 1);
            el.fireRate.textContent = fmt(w.model.fireRate, 2);
            el.fireRate.title = "Calculated burst fire rate";
            el.spread.textContent = fmt(w.model.halfAngle, 1) + "°";
            el.diameter.textContent = fmt(w.model.radius * 2, 1) + " m";
            el.spokes.textContent = fmt(w.model.spokes, 0);
            el.distance.textContent = fmt(state.distance, 0) + " m";
            for (const { field, flag } of RIVEN_FIELDS)
              el[field].disabled = el[field + "Slider"].disabled = !w[flag];
            for (const b of el.rivenFormat.children)
              b.disabled = !w.rivenMS && !w.rivenFR;
          }
          dirtyStats = false;
        }
        function paint() {
          frame = 0;
          let nextWidth, nextHeight;
          if (state.view === "side") {
            sideSize = sideLayout();
            nextWidth = sideSize.width;
            nextHeight = sideSize.height;
          } else {
            const wrap = $("canvasWrap"),
              wantedHeight = plotLayout().height;
            if (wrap.offsetHeight !== wantedHeight)
              wrap.style.height = wantedHeight + "px";
            nextWidth = Math.max(1, wrap.clientWidth);
            nextHeight = Math.max(1, wrap.clientHeight);
          }
          const nextDpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
          if (width !== nextWidth || height !== nextHeight || dpr !== nextDpr) {
            width = nextWidth;
            height = nextHeight;
            dpr = nextDpr;
            canvas.width = background.width = Math.round(width * dpr);
            canvas.height = background.height = Math.round(height * dpr);
            dirtyStatic = true;
          }
          if (dirtyStatic) staticPaint();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(background, 0, 0);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          for (const c of cells) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(
              c.x + 3,
              c.y + c.top,
              c.w - 6,
              Math.max(1, c.h - c.top - c.bottom),
            );
            ctx.clip();
            for (const w of c.weapons) drawDots(c, w);
            drawBaselines(c);
            drawTarget(ctx, c);
            ctx.restore();
          }
          if (state.view === "side") {
            const { cols, cw, ch } = sideSize,
              pw = Math.round(cw * dpr),
              ph = Math.round(ch * dpr);
            for (const w of weapons) {
              const el = ui.get(w.id),
                sx = (w.index % cols) * cw * dpr,
                sy = Math.floor(w.index / cols) * ch * dpr;
              if (el.preview.width !== pw || el.preview.height !== ph) {
                el.preview.width = pw;
                el.preview.height = ph;
              }
              el.previewCtx.drawImage(
                canvas,
                sx,
                sy,
                cw * dpr,
                ch * dpr,
                0,
                0,
                pw,
                ph,
              );
            }
          }
          if (dirtyStats) updateStats();
        }
        // Shared controls and page lifecycle.
        function bindEvents() {
          bindPair("distance", "distance", 1, 100, 1);
          bindPair("mote", "mote", 100, 1500, 1);
          $("moveDrones").addEventListener("click", () => {
            state.targetSeed += 883;
            dirtyStats = true;
            requestPaint(true);
          });
          for (const [id, key, samples] of SHARED_SWITCHES)
            $(id).addEventListener("change", () => {
              state[key] = $(id).checked;
              configure({ samples, geometry: false });
            });
          for (const [id, other, value] of [
            ["barrage", "amalgamBarrage", 90],
            ["amalgamBarrage", "barrage", 85],
          ])
            $(id).addEventListener("change", () => {
              state.barrage = $(id).checked ? value : 0;
              if ($(id).checked) $(other).checked = false;
              configure({ geometry: false });
            });
          $("history").addEventListener("input", () => {
            state.history = Number($("history").value);
            $("historyValue").textContent = String(state.history);
            regenerate();
            requestPaint();
          });
          $("play").addEventListener("click", () => setPlaying(!state.playing));
          $("singleShot").addEventListener("click", fire);
          $("reset").addEventListener("click", () => {
            state.seed = (state.seed + 7919) >>> 0;
            for (const w of weapons) {
              w.shotCount = 1;
              w.accumulator = 0;
            }
            regenerate();
            requestPaint(true);
            schedule();
          });
          $("restore").addEventListener("click", () => location.reload());
          $("viewMode").addEventListener("click", (event) => {
            const b = event.target.closest("button[data-view]");
            if (!b) return;
            state.view = b.dataset.view;
            syncViewControls();
            fitWorkspace();
            requestPaint(true);
          });
          $("projection").addEventListener("click", (event) => {
            const b = event.target.closest("[data-projection]");
            if (!b) return;
            state.projection = b.dataset.projection;
            for (const el of $("projection").children)
              el.setAttribute("aria-pressed", String(el === b));
            requestPaint(true);
          });
          $("sweepWeapon").addEventListener("change", () => {
            state.sweep = $("sweepWeapon").value;
            syncViewControls();
            requestPaint(true);
          });
          document.addEventListener("visibilitychange", schedule);
          document.addEventListener("keydown", (event) => {
            if (
              event.code === "Space" &&
              !/INPUT|SELECT|BUTTON|SUMMARY|TEXTAREA/.test(event.target.tagName)
            ) {
              event.preventDefault();
              fire();
            }
          });
          const resizeObserver = new ResizeObserver(() => requestPaint(true));
          resizeObserver.observe($("canvasWrap"));
          resizeObserver.observe($("weapons"));
          const fitObserver = new ResizeObserver(queueWorkspaceFit);
          fitObserver.observe(shell);
          fitObserver.observe($("weapons"));
          const onViewportResize = () => {
            fitWorkspace();
            requestPaint(true);
          };
          window.addEventListener("resize", onViewportResize);
          window.visualViewport?.addEventListener("resize", onViewportResize);
          compactLayout.addEventListener("change", onViewportResize);
          window.addEventListener("pagehide", () => {
            clearTimeout(timer);
            if (frame) cancelAnimationFrame(frame);
            if (fitFrame) cancelAnimationFrame(fitFrame);
          });
          window.addEventListener("pageshow", (event) => {
            if (event.persisted) {
              frame = 0;
              fitFrame = 0;
            }
            syncControlsFromState();
            requestAnimationFrame(() => {
              syncControlsFromState();
              fitWorkspace();
              dirtyStats = true;
              requestPaint(true);
            });
          });
          // Browser form restoration must not override the calculator's current flags.
          for (const el of document.querySelectorAll("input,select"))
            el.setAttribute("autocomplete", "off");
          for (const el of document.querySelectorAll("input[type=checkbox]")) {
            el.addEventListener("pointerdown", syncSwitches);
            el.addEventListener("keydown", (event) => {
              if (event.code === "Space") syncSwitches();
            });
          }
        }

        function initialize() {
          createControls();
          shell.style.setProperty("--weapon-count", weapons.length);
          bindEvents();
          syncControlsFromState();
          updateModels();
          regenerate();
          fitWorkspace();
          requestPaint(true);
        }

        initialize();
      })();
    </script>
  </body>
</html>
